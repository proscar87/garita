# Bloquear en el commit, no en el push.
#
# Si el único control está en CI, cuando falla el dato personal YA VIVE en un
# commit — y el arreglo pasa de «borra la línea» a «reescribe el historial y
# avisa a quien haya clonado». El hook es donde el arreglo todavía es barato;
# la Action es el respaldo que nadie puede saltarse con --no-verify.
- id: garita
  name: Garita — datos personales y credenciales
  description: Impide que nombres de tu padrón, identificadores mexicanos y secretos entren al repositorio.
  entry: garita
  # El «--» cierra las banderas antes de los nombres. Sin él, un
  # archivo del repositorio llamado «--version» era una BANDERA para
  # argparse: `garita --version datos.txt` imprimía la versión y
  # salía con 0, o sea que el hook aprobaba el commit entero. La
  # Action cerró este ataque en su envoltorio; esta superficie —la
  # otra con pass_filenames— se había quedado abierta.
  args: ['--']
  language: python
  pass_filenames: true
  require_serial: false
